name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: pnpm/action-setup@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build
        run: pnpm build
      
      - name: Type check
        run: pnpm typecheck
      
      - name: Lint
        run: pnpm lint

      - name: Node SDK unit tests
        run: pnpm --filter @commet/node test

      - name: Next.js integration unit tests
        run: pnpm --filter @commet/next test

      - name: CLI unit tests
        run: pnpm --filter commet test:unit

      - name: Verify package artifacts
        run: pnpm verify:packages
